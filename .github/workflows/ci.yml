name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Architecture check
        run: npm run arch-check

      - name: Typecheck
        run: npm run typecheck

      - name: Validate config
        run: npm run validate-config

      - name: Unit tests (deterministic engine + LLM e2e)
        run: npm test

  android-bundle:
    name: Civ-Monarchs browser bundle + core verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build civ-monarchs browser bundle
        run: node civ-monarchs/android/build-bundle.mjs

      - name: Verify civ-monarchs core (deterministic engine + seat blinding)
        run: node civ-monarchs/android/verify.mjs

  release-gate:
    name: Release packaging smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify release package (exclude secrets/data/logs, no stale bundle)
        run: node scripts/verify-release.mjs
